<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nix</title>
    <link rel="icon" type="image/png" href="/nix-icon.png" />
    <link rel="apple-touch-icon" href="/nix-icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#f2f2f3" />

    <!--
      Content security policy, in the document so it also holds where no reverse proxy fronts the
      app (the Vite dev server, a static preview). deploy/Caddyfile carries the same policy as a
      header, plus frame-ancestors, which a meta CSP is not allowed to express. The two are one
      policy in two places: change them together, or the deployed app and the dev server disagree
      about what is allowed. src/tests/app/content-security-policy.test.ts holds them in step.

      The script-src hash covers the inline theme script below - its exact content between the
      script tags. Any change to that script, including whitespace, must recompute the hash
      (the last regex match, because the tag pair this comment names would otherwise match first):

        python3 -c "import hashlib,base64,re,pathlib; s=pathlib.Path('apps/web/index.html').read_text(); m=re.findall(r'<script>(.*?)</script>', s, re.S)[-1]; print('sha256-'+base64.b64encode(hashlib.sha256(m.encode()).digest()).decode())"

      Three directives are looser than the rest, each for a reason:

      - style-src allows 'unsafe-inline' because inline style *attributes* fall under it, and about
        ten places carry runtime geometry in one: hour-row heights and timed-item offsets in the
        calendar, row positions in the sheet grid, pane shares and sidebar width, the caret-anchored
        slash and reference menus. None of that is expressible as a token - it is measured at
        runtime - and an inline style carries none of an inline script's risk: it cannot execute.
        The dev server needs it too, because Vite injects styles as inline <style> elements.
      - img-src allows http: and https: because item cover images and image properties are
        arbitrary third-party URLs, and the server's PropertyValidator accepts both schemes. Leaving
        http: out makes the picture picker lie: the browser blocks the image, onError fires, and the
        UI reports an address the server just accepted as wrong. img-src cannot execute anything,
        which is what makes the loosest directive here the cheapest one.
      - connect-src and frame-src name the identity provider's origin. oidc-client-ts fetches
        discovery, exchanges the code and loads userinfo over connect-src, and navigates a hidden
        iframe to the issuer's authorize endpoint for silent renew, which frame-src governs. Tokens
        live in memory only (see src/auth/oidc-config.ts), so every reload depends on that renew.
        The origin is per-deployment, so it is substituted at build time from VITE_OIDC_ISSUER by
        the oidcOriginInPolicy plugin in vite.config.ts; with no issuer configured the token is
        removed and the directives fall back to 'self'.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'sha256-qzYt63qWJpMm2Kfb4Wr8UDbUtUgweR4Gv4rs133db2w='; style-src 'self' 'unsafe-inline'; img-src 'self' http: https: data:; font-src 'self'; connect-src 'self' __NIX_OIDC_ORIGIN__; frame-src 'self' __NIX_OIDC_ORIGIN__; object-src 'none'; base-uri 'self'; form-action 'self'"
    />

    <!--
      The chosen ground, applied before the first paint.

      Everything else about theming lives in the token sheet and in src/theme, and this is the one
      piece that cannot: the application's own code runs after the browser has already painted, so
      somebody who chose dark on a light machine would see a white page flash first. That flash is
      not a polish problem - it is the whole screen, on every load.

      Blocking and inline for the same reason: a deferred or external script paints first and
      corrects afterwards, which is the flash it exists to prevent. It reads the same key and the
      same values as theme-store.ts, which is the duplication the comment there points back at.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('nix.theme');
          if (stored === 'light' || stored === 'dark') {
            document.documentElement.setAttribute('data-theme', stored);
          }
        } catch (error) {
          // Storage refused - private browsing, or policy. The media query in the token sheet is
          // still in force, so the page follows the machine rather than failing to load.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
