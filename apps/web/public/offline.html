<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f2f2f3" />
    <title>Nix is offline</title>
    <link rel="stylesheet" href="/src/app.css" />
  </head>
  <body class="min-h-dvh bg-background font-body text-foreground">
    <main class="mx-auto flex min-h-dvh max-w-lg flex-col justify-center gap-4 p-6">
      <h1 class="font-heading text-2xl">Nix is offline</h1>
      <p>
        Reconnect to open your workspace. This device has not cached your documents for offline
        reading.
      </p>
      <p>If you were editing, return to the open Nix window while it reconnects.</p>
      <p>
        <a
          class="inline-flex min-h-12 items-center rounded-md border border-divider px-4 text-accent"
          href="/"
          >Try again</a
        >
      </p>
    </main>
  </body>
</html>
