name: Bug report
description: Something in Nix does not work as it should.
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        A security problem goes to a [private advisory](https://github.com/sianachi/nixsites/security/advisories/new), not a public issue.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Nix version or image tag
      description: A release tag such as v0.3.1, or the image tag (the full commit SHA) from ghcr.io/sianachi/nix.
      placeholder: v0.3.1
    validations:
      required: true
  - type: dropdown
    id: install-method
    attributes:
      label: Install method
      description: How this copy of Nix is installed.
      options:
        - Docker Compose
        - Kubernetes
        - Demo site
        - Local development
        - Other
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: Browser or client
      description: Where you saw the problem.
      options:
        - Web
        - nixctl
        - MCP
        - REST API
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste the relevant log output. Remove tokens, secrets, hostnames and personal data first.
      render: shell
