name: Bug report
description: Something in Nix does not work as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Security problem? Do not file it here. See SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: A release tag such as v0.3.0, or the commit SHA.
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Where it runs
      options:
        - Local development (pnpm dev)
        - Docker Compose
        - Kubernetes
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove tokens, passwords, hostnames and personal data before you paste.
      render: text
