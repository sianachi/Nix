# Multi-architecture release images, published to GitHub Container Registry.
#
# Builds the six images of deploy/docker/build-and-push.sh (api, migrator,
# collab, worker, web, release-tools) and the speech role's processor image
# (speech-worker) for linux/amd64 and linux/arm64. The speech role's Jetson image
# (speech-worker-l4t) is built for linux/arm64 alone, by its own job below. Each
# architecture builds on its own native runner rather than under QEMU emulation, which is several
# times slower for the .NET and Go compiles. The per-architecture digests are
# then stitched into one multi-arch manifest per image, so a plain `docker pull`
# on either an Intel/AMD or an ARM host resolves to the matching build.
#
# Only images whose inputs changed since the previous main commit are rebuilt. The
# rest are carried forward: the previous commit's published manifest is tagged
# with this commit's SHA, so every main commit still has every image and a
# release can deploy any SHA. A manual dispatch rebuilds everything.
#
# Build layers are cached in GHCR (a buildcache-<arch> tag per image), not in the
# Actions cache: the Jetson base alone is several gigabytes, and the 10 GB Actions
# cache limit would evict the pnpm, NuGet and Go caches the test workflows rely on.
#
# Published as ghcr.io/<owner>/nix/<image>:<full commit SHA>. There is
# deliberately no "latest": a floating tag with imagePullPolicy IfNotPresent
# keeps running the old build. Deploy with REGISTRY=ghcr.io/<owner>/nix
# TAG=$(git rev-parse HEAD).
#
# Builds run only for main: on a push to it, or a manual dispatch against it.
# Pull requests, other branches and tags do not build images; the backend,
# frontend and deploy workflows still check pull requests before they merge.
name: CI images

on:
  push:
    branches: [main]
  workflow_dispatch:

# One main-branch build at a time, never cancelled: a published SHA is what a release deploys.
concurrency:
  group: ci-images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Decides, per image, whether this commit rebuilds it or carries the previous
  # commit's image forward. An image is rebuilt when any path its Dockerfile copies
  # changed, when the previous commit's image is not published (its run failed or
  # was superseded while pending), or when there is no previous commit to compare
  # against (manual dispatch, first push, force push). The path lists mirror the
  # COPY lines of deploy/docker/*.Dockerfile; keep them in step.
  plan:
    name: Plan image builds
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    outputs:
      build: ${{ steps.plan.outputs.build }}
      publish: ${{ steps.plan.outputs.publish }}
      retag: ${{ steps.plan.outputs.retag }}
      l4t: ${{ steps.plan.outputs.l4t }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Plan
        id: plan
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nix"
          changed="$RUNNER_TEMP/changed"
          all=false
          if [ -z "${BEFORE:-}" ] || [ "$BEFORE" = 0000000000000000000000000000000000000000 ]; then
            all=true
          elif ! git fetch --no-tags --depth=1 origin "$BEFORE"; then
            all=true
          else
            git diff --name-only "$BEFORE" "$GITHUB_SHA" > "$changed"
            # The build context and this workflow affect every image.
            if grep -qxE '\.dockerignore|\.github/workflows/ci-images\.yml' "$changed"; then all=true; fi
          fi
          echo "Rebuild everything: $all"

          # A path ending in / matches everything under it; any other path matches itself.
          touches() {
            [ "$all" = true ] && return 0
            local f p
            while IFS= read -r f; do
              for p in "$@"; do
                if [ "$f" = "$p" ] || { [[ "$p" == */ ]] && [[ "$f" == "$p"* ]]; }; then return 0; fi
              done
            done < "$changed"
            return 1
          }

          decide() {
            local name="$1"; shift
            if touches "$@"; then echo build; return; fi
            if ! docker buildx imagetools inspect "$registry/$name:$BEFORE" >/dev/null 2>&1; then
              echo "::notice::$name:$BEFORE is not published; rebuilding $name" >&2
              echo build; return
            fi
            echo retag
          }

          build='[]'; publish='[]'; retag='[]'
          plan() {
            local name="$1" dockerfile="$2" target="$3"; shift 3
            if [ "$(decide "$name" "$dockerfile" "$@")" = build ]; then
              for arch in amd64 arm64; do
                runner=ubuntu-24.04; [ "$arch" = arm64 ] && runner=ubuntu-24.04-arm
                build=$(jq -c --arg n "$name" --arg d "$dockerfile" --arg t "$target" --arg a "$arch" --arg r "$runner" \
                  '. + [{name: $n, dockerfile: $d, target: $t, arch: $a, runner: $r}]' <<< "$build")
              done
              publish=$(jq -c --arg n "$name" '. + [$n]' <<< "$publish")
            else
              retag=$(jq -c --arg n "$name" '. + [$n]' <<< "$retag")
            fi
          }

          node_root="package.json pnpm-lock.yaml pnpm-workspace.yaml tsconfig.base.json packages/"
          # shellcheck disable=SC2086
          {
            plan api deploy/docker/backend.Dockerfile api Nix.slnx backend/
            plan migrator deploy/docker/backend.Dockerfile migrator Nix.slnx backend/
            plan collab deploy/docker/node.Dockerfile collab $node_root deploy/template-sync/ apps/collab/ apps/web/package.json
            plan worker deploy/docker/go-workers.Dockerfile '' apps/go-workers/
            plan speech-worker deploy/docker/speech-worker.Dockerfile '' apps/go-workers/
            plan web deploy/docker/web.Dockerfile web $node_root apps/web/ apps/collab/package.json
            plan release-tools deploy/docker/release-tools.Dockerfile release-tools $node_root deploy/template-sync/ \
              apps/cli/ apps/web/package.json apps/collab/package.json deploy/compose/smoke.mjs deploy/compose/nixctl.sh \
              deploy/compose/verify-artifact.py deploy/docker/release-tools-entrypoint.sh
          }

          l4t=$(decide speech-worker-l4t deploy/docker/speech-worker.l4t.Dockerfile apps/go-workers/)
          if [ "$l4t" = retag ]; then retag=$(jq -c '. + ["speech-worker-l4t"]' <<< "$retag"); fi

          {
            echo "build=$build"
            echo "publish=$publish"
            echo "retag=$retag"
            echo "l4t=$l4t"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Image plan"
            echo "- Rebuild: $(jq -r 'join(", ")' <<< "$publish") $([ "$l4t" = build ] && echo '(and speech-worker-l4t)')"
            echo "- Carried forward from \`${BEFORE:-none}\`: $(jq -r 'join(", ")' <<< "$retag")"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build ${{ matrix.name }} (${{ matrix.arch }})
    needs: plan
    if: needs.plan.outputs.build != '[]'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.build) }}
    steps:
      - uses: actions/checkout@v5

      # GHCR repository paths must be lowercase; the owner may not be.
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nix/${{ matrix.name }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.arch }}
          # Pushed by digest only; the merge job attaches the tags to the manifest list.
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.arch }},mode=max,image-manifest=true,oci-mediatypes=true

      - name: Record digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest='${{ steps.build.outputs.digest }}'
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v6
        with:
          name: digests-${{ matrix.name }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish ${{ matrix.image }}
    needs: [plan, build]
    if: needs.plan.outputs.publish != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.plan.outputs.publish) }}
    steps:
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nix/${{ matrix.image }}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v7
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=sha,prefix=,format=long

      - name: Create multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)

      - name: Inspect
        run: docker buildx imagetools inspect "$IMAGE:${{ github.sha }}"

  # The speech role's Jetson image: whisper.cpp built against CUDA on NVIDIA's L4T base images,
  # which exist for linux/arm64 only, so there is nothing to stitch and the tag is pushed here.
  # Not needed by the publish job above and not allowed to fail it. A deployment without the
  # speech profile never pulls this image; one with it is refused by release.sh, before anything
  # stops, if this job did not publish the commit's image.
  speech-l4t:
    name: Build speech-worker-l4t (arm64)
    needs: plan
    if: needs.plan.outputs.l4t == 'build'
    runs-on: ubuntu-24.04-arm
    # A cold build compiles whisper.cpp against CUDA and takes about half an hour.
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nix/speech-worker-l4t" >> "$GITHUB_ENV"

      # The L4T build image is several gigabytes; make room for it on the runner.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/speech-worker.l4t.Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache-arm64
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache-arm64,mode=max,image-manifest=true,oci-mediatypes=true

      - name: Inspect
        run: docker buildx imagetools inspect "$IMAGE:${{ github.sha }}"

  # Unchanged images: the previous commit's manifest, tagged with this commit's SHA. The
  # plan job confirmed each source tag exists before choosing this over a rebuild.
  retag:
    name: Carry forward unchanged images
    needs: plan
    if: needs.plan.outputs.retag != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the previous commit's images with this commit
        env:
          RETAG: ${{ needs.plan.outputs.retag }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nix"
          for name in $(jq -r '.[]' <<< "$RETAG"); do
            echo "$name: $BEFORE -> $GITHUB_SHA"
            docker buildx imagetools create -t "$registry/$name:$GITHUB_SHA" "$registry/$name:$BEFORE"
            docker buildx imagetools inspect "$registry/$name:$GITHUB_SHA" >/dev/null
          done
