# Multi-architecture release images, published to GitHub Container Registry.
#
# Builds the six images of deploy/docker/build-and-push.sh (api, migrator,
# collab, worker, web, release-tools) and the speech role's processor image
# (speech-worker) for linux/amd64 and linux/arm64. The speech role's Jetson image
# (speech-worker-l4t) is built for linux/arm64 alone, by its own job below. Each
# architecture builds on its own native runner rather than under QEMU emulation, which is several
# times slower for the .NET and Go compiles. The per-architecture digests are
# then stitched into one multi-arch manifest per image, so a plain `docker pull`
# on either an Intel/AMD or an ARM host resolves to the matching build.
#
# Published as ghcr.io/<owner>/nix/<image>:<full commit SHA>. There is
# deliberately no "latest": a floating tag with imagePullPolicy IfNotPresent
# keeps running the old build. Deploy with REGISTRY=ghcr.io/<owner>/nix
# TAG=$(git rev-parse HEAD).
#
# Builds run only for main: on a push to it, or a manual dispatch against it.
# Pull requests, other branches and tags do not build images; the backend,
# frontend and deploy workflows still check pull requests before they merge.
name: CI images

on:
  push:
    branches: [main]
  workflow_dispatch:

# One main-branch build at a time, never cancelled: a published SHA is what a release deploys.
concurrency:
  group: ci-images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.image.name }} (${{ matrix.arch }})
    # A manual dispatch can name any branch; only main is ever built and published.
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: api, dockerfile: deploy/docker/backend.Dockerfile, target: api }
          - { name: migrator, dockerfile: deploy/docker/backend.Dockerfile, target: migrator }
          - { name: collab, dockerfile: deploy/docker/node.Dockerfile, target: collab }
          - { name: worker, dockerfile: deploy/docker/go-workers.Dockerfile, target: '' }
          - { name: speech-worker, dockerfile: deploy/docker/speech-worker.Dockerfile, target: '' }
          - { name: web, dockerfile: deploy/docker/web.Dockerfile, target: web }
          - {
              name: release-tools,
              dockerfile: deploy/docker/release-tools.Dockerfile,
              target: release-tools,
            }
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5

      # GHCR repository paths must be lowercase; the owner may not be.
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nix/${{ matrix.image.name }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          target: ${{ matrix.image.target }}
          platforms: linux/${{ matrix.arch }}
          # Pushed by digest only; the merge job attaches the tags to the manifest list.
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}-${{ matrix.arch }}

      - name: Record digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest='${{ steps.build.outputs.digest }}'
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v6
        with:
          name: digests-${{ matrix.image.name }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish ${{ matrix.image }}
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [api, migrator, collab, worker, speech-worker, web, release-tools]
    steps:
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nix/${{ matrix.image }}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v7
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=sha,prefix=,format=long

      - name: Create multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)

      - name: Inspect
        run: docker buildx imagetools inspect "$IMAGE:${{ github.sha }}"

  # The speech role's Jetson image: whisper.cpp built against CUDA on NVIDIA's L4T base images,
  # which exist for linux/arm64 only, so there is nothing to stitch and the tag is pushed here.
  # Not needed by the publish job above and not allowed to fail it. A deployment without the
  # speech profile never pulls this image; one with it is refused by release.sh, before anything
  # stops, if this job did not publish the commit's image.
  speech-l4t:
    name: Build speech-worker-l4t (arm64)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nix/speech-worker-l4t" >> "$GITHUB_ENV"

      # The L4T build image is several gigabytes; make room for it on the runner.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/speech-worker.l4t.Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=speech-worker-l4t-arm64
          cache-to: type=gha,mode=max,scope=speech-worker-l4t-arm64

      - name: Inspect
        run: docker buildx imagetools inspect "$IMAGE:${{ github.sha }}"
