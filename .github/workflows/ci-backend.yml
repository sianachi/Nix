# Backend CI (engineering plan section 9.2).
#   Stage 1 static -> Stage 2 unit. Integration (Testcontainers) is stage 3.
#
# Split from the frontend workflow so the two lanes can be developed in
# parallel without contending for one file. Path filters mean a frontend-only
# change does not queue a .NET toolchain run, and vice versa. Files shared by
# both lanes (the guard scripts, the workflows themselves) trigger both.
#
# Nix.slnx sits at the repository root rather than under backend/ so that one
# IDE window covers both lanes. That puts it outside the backend/** filter, so
# it is listed on its own below; the steps that name it run from the checkout
# root while the per-project steps still run from backend/.
name: CI backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'Nix.slnx'
      - 'scripts/check-byte-array-markers.sh'
      - 'scripts/check-no-controllers.sh'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'Nix.slnx'
      - 'scripts/check-byte-array-markers.sh'
      - 'scripts/check-no-controllers.sh'
      - '.github/workflows/ci-backend.yml'

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  backend-static:
    name: backend static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          # mise.toml pins dotnet = "10"; track the same major here.
          dotnet-version: 10.0.x

      - name: Verify formatting (dotnet format)
        run: dotnet format Nix.slnx --verify-no-changes

      - name: Build (analyzers + warnings-as-errors)
        run: dotnet build Nix.slnx --configuration Release

      # The build above regenerates backend/openapi/nix-api.json (see the OpenAPI
      # section of Nix.Api.csproj). If the committed contract no longer matches the
      # code, the generated frontend client is stale - fail here rather than at
      # runtime. Fix by rebuilding locally and committing the regenerated file.
      #
      # This is also the seam between the two development lanes: the frontend
      # generates its types from this artifact, so it must never drift.
      - name: OpenAPI contract is committed and current
        run: git diff --exit-code -- backend/openapi

      - name: Byte-array marker guard (memory rule 7)
        run: ./scripts/check-byte-array-markers.sh

      - name: No-controllers guard (minimal APIs only, section 2.3)
        run: ./scripts/check-no-controllers.sh

  backend-unit:
    name: backend unit
    runs-on: ubuntu-latest
    needs: backend-static
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Explicit project list: Nix.Integration.Tests is excluded here on
      # purpose - it needs Docker and runs in its own stage-3 job.
      - name: Unit tests
        working-directory: backend
        run: |
          dotnet test tests/Nix.Core.Tests/Nix.Core.Tests.csproj --configuration Release
          dotnet test tests/Nix.Application.Tests/Nix.Application.Tests.csproj --configuration Release
          dotnet test tests/Nix.Api.Tests/Nix.Api.Tests.csproj --configuration Release

  # ── Stage 3: integration ───────────────────────────────────────────────────
  # Everything that needs a real Postgres: the tenant isolation policies, the
  # composite foreign keys that stop cross-tenant references, the grants matrix,
  # the pre-authentication identity provider resolver, and the SET LOCAL pooling
  # proof.
  #
  # These are the tests the engineering plan calls the crown jewels, and until
  # this job existed they ran only on whichever machine last touched them. A
  # permission regression is a breach rather than a defect, so "someone ran it
  # locally" is not a control.
  #
  # Parallel to backend-unit rather than after it: both need the static stage to
  # have passed, neither needs the other, and a broken policy should not wait on
  # a unit suite to be reported.
  backend-integration:
    name: backend integration
    runs-on: ubuntu-latest
    needs: backend-static
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # No docker setup step: ubuntu-latest ships a running daemon, and
      # Testcontainers finds it through the default socket. Asserted rather than
      # assumed, because the failure mode otherwise is a confusing timeout deep
      # inside the fixture rather than a clear message here.
      - name: Docker is available for Testcontainers
        run: docker info --format 'docker {{.ServerVersion}}'

      # Pulled explicitly so the image download is its own step. Inside the
      # fixture it would land in the first test's timeout budget and present as
      # a flake on a cold runner.
      - name: Pre-pull the Postgres image
        run: docker pull pgvector/pgvector:pg16

      - name: Integration tests
        working-directory: backend
        run: dotnet test tests/Nix.Integration.Tests/Nix.Integration.Tests.csproj --configuration Release
