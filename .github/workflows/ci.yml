# CI pipeline, stages 1-2 (engineering plan section 9.2).
#   Stage 1 (static, parallel):  backend-static | frontend-static
#   Stage 2 (unit, parallel):    backend-unit   | frontend-unit
# Later goals add stage 3 (integration/Testcontainers, Storybook+axe),
# stage 4 (contract) and the merge-queue E2E stage.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# One live run per ref; a newer push cancels the superseded run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # Stage 1 -------------------------------------------------------------
  backend-static:
    name: backend static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          # mise.toml pins dotnet = "10"; track the same major here.
          dotnet-version: 10.0.x

      - name: Verify formatting (dotnet format)
        working-directory: backend
        run: dotnet format Nix.slnx --verify-no-changes

      - name: Build (analyzers + warnings-as-errors)
        working-directory: backend
        run: dotnet build Nix.slnx --configuration Release

      # The build above regenerates backend/openapi/nix-api.json (see the OpenAPI
      # section of Nix.Api.csproj). If the committed contract no longer matches the
      # code, the generated frontend client is stale - fail here rather than at
      # runtime. Fix by rebuilding locally and committing the regenerated file.
      - name: OpenAPI contract is committed and current
        run: git diff --exit-code -- backend/openapi

      - name: Byte-array marker guard (memory rule 7)
        run: ./scripts/check-byte-array-markers.sh

      - name: No-controllers guard (minimal APIs only, section 2.3)
        run: ./scripts/check-no-controllers.sh

  frontend-static:
    name: frontend static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No version input: pnpm/action-setup reads the root package.json
      # "packageManager" field, keeping CI pinned with the repo.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # mise.toml pins node = "22"; track the same major here.
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Root scripts use `pnpm -r --if-present`, so lint/typecheck stay
      # green while the workspace has no packages yet.
      - name: Lint (ESLint + Prettier check)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Design-token guard (no raw hex outside packages/design-tokens)
        run: ./scripts/check-raw-design-values.sh

  # Stage 2 -------------------------------------------------------------
  backend-unit:
    name: backend unit
    runs-on: ubuntu-latest
    needs: backend-static
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Explicit project list: Nix.Integration.Tests is excluded here on
      # purpose - it will run against Testcontainers in its own stage-3 job
      # in a later goal.
      - name: Unit tests
        working-directory: backend
        run: |
          dotnet test tests/Nix.Core.Tests/Nix.Core.Tests.csproj --configuration Release
          dotnet test tests/Nix.Application.Tests/Nix.Application.Tests.csproj --configuration Release
          dotnet test tests/Nix.Api.Tests/Nix.Api.Tests.csproj --configuration Release

  frontend-unit:
    name: frontend unit
    runs-on: ubuntu-latest
    needs: frontend-static
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm -r --if-present test` under the hood: green with zero
      # workspace packages, picks suites up as packages land.
      - name: Unit tests
        run: pnpm test
