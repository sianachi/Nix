# Rendered with envsubst by deploy/k8s/deploy.sh - needs $REGISTRY, $TAG.
apiVersion: v1
kind: Service
metadata: { name: nix-media, namespace: nix }
spec:
  selector: { app: nix-media }
  ports: [{ port: 8200, targetPort: 8200 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: nix-media, namespace: nix }
spec:
  replicas: 2
  selector: { matchLabels: { app: nix-media } }
  template:
    metadata: { labels: { app: nix-media } }
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: media
          image: ${REGISTRY}/media:${TAG}
          ports: [{ containerPort: 8200 }]
          env:
            # No database credentials. Ever. The process refuses to start if any
            # appear, which is the executable form of the rule - do not attach
            # nix-connections to this pod under any name.
            - name: NIX_MEDIA_COLLAB_BASE_URL
              value: http://nix-collab:8100
            - name: NIX_MEDIA_INTERNAL_SECRET
              valueFrom: { secretKeyRef: { name: nix-internal, key: secret } }
            - name: NIX_MEDIA_MAX_CONCURRENT_EXPORTS
              value: "4"
            - name: NIX_MEDIA_JOB_TIMEOUT_MS
              value: "30000"
          livenessProbe:
            httpGet: { path: /healthz, port: 8200 }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /healthz, port: 8200 }
            periodSeconds: 5
          resources:
            # A renderer is CPU-bound and single-threaded; the concurrency gate above is
            # what protects the other exports.
            requests: { cpu: 500m, memory: 512Mi }
            limits: { cpu: "2", memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
---
# Documents the intended isolation - media may reach collab and DNS, nothing else. k3s
# ships Flannel by default, which does NOT enforce NetworkPolicy. This is inert until the
# cluster runs Calico (--flannel-backend=none) or Cilium; check before relying on it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: media-egress, namespace: nix }
spec:
  podSelector: { matchLabels: { app: nix-media } }
  policyTypes: [Egress]
  egress:
    - to: [{ podSelector: { matchLabels: { app: nix-collab } } }]
      ports: [{ protocol: TCP, port: 8100 }]
    - ports: [{ protocol: UDP, port: 53 }]   # DNS
