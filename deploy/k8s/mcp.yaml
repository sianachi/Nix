# Remote MCP: the nixctl tool contract over Streamable HTTP at /mcp, served by the release-tools
# image. Every request carries its own personal access token; the pod holds no credential and Core
# authorizes each call. deploy.sh applies this file unless NIX_MCP_ENABLED=false, which deletes it.
apiVersion: v1
kind: Service
metadata: { name: nix-mcp, namespace: nix }
spec:
  selector: { app: nix-mcp }
  ports: [{ port: 8500, targetPort: 8500 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: nix-mcp, namespace: nix }
spec:
  replicas: 1
  selector: { matchLabels: { app: nix-mcp } }
  template:
    metadata:
      labels: { app: nix-mcp }
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: mcp
          image: ${REGISTRY}/release-tools:${TAG}
          args: ["nixctl", "mcp", "--listen", "0.0.0.0:8500"]
          ports: [{ containerPort: 8500 }]
          env:
            - name: NIX_API_URL
              value: http://nix-api:8080
            - name: NIX_COLLAB_URL
              value: http://nix-collab:8100
          livenessProbe:
            httpGet: { path: /healthz, port: 8500 }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /healthz, port: 8500 }
            periodSeconds: 5
          resources: { requests: { cpu: 50m, memory: 96Mi }, limits: { cpu: "1", memory: 256Mi } }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
      volumes: [{ name: tmp, emptyDir: { sizeLimit: 16Mi } }]
---
# Its own Ingress so turning MCP off removes the route; an exact path wins over the app's prefix
# in ingress.yaml.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nix-mcp
  namespace: nix
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: "${INGRESS_MIDDLEWARES}"
    nginx.ingress.kubernetes.io/ssl-redirect: "${INGRESS_SSL_REDIRECT}"
spec:
  ingressClassName: ${INGRESS_CLASS}
  tls:
    - hosts: ${TLS_HOSTS}
      secretName: nix-tls
  rules:
    - host: "${DOMAIN}"
      http:
        paths:
          - path: /mcp
            pathType: Exact
            backend:
              service: { name: nix-mcp, port: { number: 8500 } }
