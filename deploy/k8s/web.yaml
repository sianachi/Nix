# Rendered with envsubst by deploy/k8s/deploy.sh.
apiVersion: v1
kind: Service
metadata: { name: nix-web, namespace: nix }
spec:
  selector: { app: nix-web }
  ports: [{ port: 8090, targetPort: 8090 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: nix-web, namespace: nix }
spec:
  replicas: 2
  selector: { matchLabels: { app: nix-web } }
  template:
    metadata:
      labels: { app: nix-web }
      annotations: { nix.io/object-store-secret-version: "${OBJECT_STORE_SECRET_VERSION}" }
    spec:
      containers:
        - name: caddy
          image: ${REGISTRY}/web:${TAG}
          ports: [{ containerPort: 8090 }]
          env:
            # Must match Core's browser capability origin so Caddy admits the signed download and
            # upload requests without broadening connect-src to arbitrary hosts.
            - name: NIX_OBJECT_STORE_PUBLIC_ORIGIN
              valueFrom: { secretKeyRef: { name: nix-object-store, key: public-origin } }
          volumeMounts:
            - { name: caddyfile, mountPath: /etc/caddy, readOnly: true }
            - { name: caddy-data, mountPath: /data }
            - { name: caddy-config, mountPath: /config }
          readinessProbe:
            httpGet: { path: /, port: 8090 }
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
      volumes:
        - name: caddyfile
          configMap: { name: nix-caddy }
        - { name: caddy-data, emptyDir: {} }
        - { name: caddy-config, emptyDir: {} }
