apiVersion: v1
kind: Service
metadata: { name: nix-rabbitmq, namespace: nix }
spec:
  clusterIP: None
  selector: { app: nix-rabbitmq }
  # Plaintext AMQP is namespace-internal. External brokers belong behind per-role amqps:// URLs.
  ports: [{ name: amqp, port: 5672, targetPort: 5672 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: nix-rabbitmq, namespace: nix }
spec:
  serviceName: nix-rabbitmq
  replicas: 1
  selector: { matchLabels: { app: nix-rabbitmq } }
  template:
    metadata:
      labels: { app: nix-rabbitmq }
      annotations: { nix.io/rabbitmq-secret-version: "${RABBITMQ_SECRET_VERSION}" }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: rabbitmq
          image: rabbitmq:4.1-management-alpine
          command: ["/bin/sh", "/etc/rabbitmq/nix-start.sh"]
          ports: [{ name: amqp, containerPort: 5672 }]
          env:
            - name: NIX_RABBITMQ_API_PASSWORD
              valueFrom: { secretKeyRef: { name: nix-rabbitmq, key: api-password } }
            - name: NIX_RABBITMQ_IMPORT_PASSWORD
              valueFrom: { secretKeyRef: { name: nix-rabbitmq, key: import-password } }
            - name: NIX_RABBITMQ_EXPORT_PASSWORD
              valueFrom: { secretKeyRef: { name: nix-rabbitmq, key: export-password } }
            - name: NIX_RABBITMQ_INDEX_PASSWORD
              valueFrom: { secretKeyRef: { name: nix-rabbitmq, key: index-password } }
          livenessProbe:
            exec: { command: [rabbitmq-diagnostics, -q, ping] }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - test -f /var/lib/rabbitmq/.nix-topology-ready && rabbitmq-diagnostics -q check_running
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 12
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 768Mi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/rabbitmq }
            - { name: config, mountPath: /etc/rabbitmq/rabbitmq.conf, subPath: rabbitmq.conf, readOnly: true }
            - { name: config, mountPath: /etc/rabbitmq/definitions.json, subPath: definitions.json, readOnly: true }
            - { name: config, mountPath: /etc/rabbitmq/nix-start.sh, subPath: start.sh, readOnly: true }
            - { name: tmp, mountPath: /tmp }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: config
          configMap: { name: nix-rabbitmq-config }
        - { name: tmp, emptyDir: {} }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: { storage: 5Gi }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: rabbitmq-ingress, namespace: nix }
spec:
  podSelector: { matchLabels: { app: nix-rabbitmq } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: nix-api } }
        - podSelector:
            matchExpressions:
              - { key: app, operator: In, values: [nix-import-worker, nix-export-worker, nix-indexer] }
      ports: [{ protocol: TCP, port: 5672 }]
