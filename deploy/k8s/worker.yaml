apiVersion: v1
kind: Service
metadata: { name: nix-indexer, namespace: nix }
spec:
  selector: { app: nix-indexer }
  ports: [{ port: 8301, targetPort: 8301 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: nix-indexer, namespace: nix }
spec:
  replicas: 2
  selector: { matchLabels: { app: nix-indexer } }
  template:
    metadata: { labels: { app: nix-indexer } }
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: indexer
          image: ${REGISTRY}/indexer:${TAG}
          ports: [{ containerPort: 8301 }]
          env:
            - name: NIX_WORKER_INTERNAL_SECRET
