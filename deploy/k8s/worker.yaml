---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: go-workers-egress, namespace: nix }
spec:
  podSelector:
    matchExpressions: [{ key: app, operator: In, values: [nix-import-worker, nix-export-worker, nix-indexer] }]
  policyTypes: [Egress]
  egress:
    - to: [{ podSelector: { matchLabels: { app: nix-api } } }]
      ports: [{ protocol: TCP, port: 8080 }]
    - to: [{ podSelector: { matchLabels: { app: nix-collab } } }]
      ports: [{ protocol: TCP, port: 8100 }]
    - to: [{ podSelector: { matchLabels: { app: nix-rabbitmq } } }]
      ports: [{ protocol: TCP, port: 5672 }]
    - to: [{ podSelector: { matchLabels: { app: nix-opensearch } } }]
      ports: [{ protocol: TCP, port: 9200 }]
    - ports: [{ protocol: TCP, port: 443 }]
    - ports: [{ protocol: UDP, port: 53 }]
