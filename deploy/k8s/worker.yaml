# Rendered with envsubst by deploy/k8s/deploy.sh - needs $REGISTRY, $TAG.
apiVersion: v1
kind: Service
metadata: { name: nix-import-worker, namespace: nix }
spec:
  selector: { app: nix-import-worker }
  ports: [{ port: 8301, targetPort: 8301 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: nix-import-worker, namespace: nix }
spec:
  replicas: 2
  selector: { matchLabels: { app: nix-import-worker } }
  template:
    metadata: { labels: { app: nix-import-worker } }
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: import-worker
          image: ${REGISTRY}/import-worker:${TAG}
          ports: [{ containerPort: 8301 }]
          env:
            - name: NIX_WORKER_INTERNAL_SECRET
              valueFrom: { secretKeyRef: { name: nix-internal, key: secret } }
            - name: NIX_WORKER_API_URL
              value: http://nix-api:8080
            - name: NIX_WORKER_MAX_CONCURRENCY
              value: "4"
            - name: NIX_WORKER_MAX_INPUT_BYTES
              value: "67108864"
            - name: NIX_WORKER_MAX_LINE_BYTES
              value: "4194304"
            - name: NIX_WORKER_MAX_RECORDS
              value: "100000"
          livenessProbe: { httpGet: { path: /healthz, port: 8301 }, periodSeconds: 10 }
          readinessProbe: { httpGet: { path: /readyz, port: 8301 }, periodSeconds: 5 }
          resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { cpu: "1", memory: 256Mi } }
          volumeMounts: [{ name: staging, mountPath: /tmp }]
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
      volumes: [{ name: staging, emptyDir: { sizeLimit: 128Mi } }]
---
