# Origin lock: the nix Ingress (deploy/k8s/ingress.yaml) admits only Cloudflare's edge, so nobody
# can reach the origin directly and set CF-Connecting-IP themselves (deploy/k8s/Caddyfile trusts
# that header). Applied verbatim by deploy/k8s/deploy.sh before the Ingress.
#
# The ranges are Cloudflare's published list. Refresh this file when Cloudflare changes them and
# redeploy (or `kubectl apply -f deploy/k8s/cloudflare-only.yaml`):
#   curl -s https://www.cloudflare.com/ips-v4 https://www.cloudflare.com/ips-v6
#
# Traefik must see the real peer address for this to work. On k3s the bundled Traefik Service
# defaults to externalTrafficPolicy: Cluster, which SNATs every request to a node address and makes
# this middleware answer 403 to everyone. Set it to Local first with a HelmChartConfig:
#   apiVersion: helm.cattle.io/v1
#   kind: HelmChartConfig
#   metadata: { name: traefik, namespace: kube-system }
#   spec:
#     valuesContent: |-
#       service: { spec: { externalTrafficPolicy: Local } }
# ipAllowList is Traefik v3 (k3s 1.32+); Traefik v2 names the same block ipWhiteList.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: { name: cloudflare-only, namespace: nix }
spec:
  ipAllowList:
    sourceRange:
      - 173.245.48.0/20
      - 103.21.244.0/22
      - 103.22.200.0/22
      - 103.31.4.0/22
      - 141.101.64.0/18
      - 108.162.192.0/18
      - 190.93.240.0/20
      - 188.114.96.0/20
      - 197.234.240.0/22
      - 198.41.128.0/17
      - 162.158.0.0/15
      - 104.16.0.0/13
      - 104.24.0.0/14
      - 172.64.0.0/13
      - 131.0.72.0/22
      - 2400:cb00::/32
      - 2606:4700::/32
      - 2803:f800::/32
      - 2405:b500::/32
      - 2405:8100::/32
      - 2a06:98c0::/29
      - 2c0f:f248::/32
