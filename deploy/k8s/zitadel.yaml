# Rendered with envsubst by deploy/k8s/deploy.sh - needs $DOMAIN, $TAG.
#
# Identity provider at https://auth.$DOMAIN (the issuer Core trusts, OIDC_ISSUER). It stores its
# data in the stack's Postgres, in its own database owned by its own login role: the Job below
# creates both with the superuser, so Zitadel itself never holds administrative database rights, and
# revokes PUBLIC's default CONNECT so the Nix roles cannot open its database. Zitadel's own init then creates its schemas
# ("init zitadel"), and start-from-setup applies migrations and the first instance.
#
# The first instance is invite-only (self-registration off), uses Zitadel's built-in login (the
# v2 login is a separate service this stack does not run) and bootstraps one human administrator
# from secret nix-zitadel, who must change the password at first sign-in. These FIRSTINSTANCE and
# DEFAULTINSTANCE values apply only when the instance is created; later changes go through the
# console. Masterkey and passwords: deploy/k8s/create-secrets.sh --zitadel-only.
apiVersion: batch/v1
kind: Job
metadata: { name: nix-zitadel-db-${TAG}, namespace: nix }
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: database
          image: pgvector/pgvector:pg16
          env:
            - { name: PGHOST, value: postgres }
            - { name: PGUSER, value: postgres }
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: nix-db, key: superuser-password } }
            - name: ZITADEL_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: nix-zitadel, key: db-password } }
          command: ["/bin/bash", "-ec"]
          args:
            - |
              psql -v ON_ERROR_STOP=1 -d postgres -v pw="$ZITADEL_DB_PASSWORD" <<'SQL'
              SELECT format('CREATE ROLE zitadel LOGIN PASSWORD %L', :'pw')
                WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'zitadel') \gexec
              ALTER ROLE zitadel WITH LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE PASSWORD :'pw';
              SELECT 'CREATE DATABASE zitadel OWNER zitadel'
                WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = 'zitadel') \gexec
              REVOKE ALL ON DATABASE zitadel FROM PUBLIC;
              SQL
          resources: { requests: { cpu: 10m, memory: 32Mi }, limits: { memory: 128Mi } }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: nix-zitadel-env, namespace: nix }
data:
  ZITADEL_DATABASE_POSTGRES_HOST: postgres
  ZITADEL_DATABASE_POSTGRES_PORT: "5432"
  ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
  ZITADEL_DATABASE_POSTGRES_USER_USERNAME: zitadel
  # Plaintext inside the namespace, like Core's own connection.
  ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
  ZITADEL_DATABASE_POSTGRES_MAXOPENCONNS: "10"
  ZITADEL_EXTERNALDOMAIN: "auth.${DOMAIN}"
  ZITADEL_EXTERNALPORT: "443"
  ZITADEL_EXTERNALSECURE: "true"
  ZITADEL_FIRSTINSTANCE_ORG_NAME: Nix
  ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: "true"
  ZITADEL_DEFAULTINSTANCE_LOGINPOLICY_ALLOWREGISTER: "false"
  ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: "false"
---
apiVersion: v1
kind: Service
metadata:
  name: nix-zitadel
  namespace: nix
  # Zitadel serves its APIs over HTTP/2; Traefik must speak h2c to it.
  annotations: { traefik.ingress.kubernetes.io/service.serversscheme: h2c }
spec:
  selector: { app: nix-zitadel }
  ports: [{ port: 8080, targetPort: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: nix-zitadel, namespace: nix }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: nix-zitadel } }
  template:
    metadata:
      labels: { app: nix-zitadel }
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, seccompProfile: { type: RuntimeDefault } }
      initContainers:
        - name: schema
          image: ghcr.io/zitadel/zitadel:v4.16.1
          args: ["init", "zitadel"]
          envFrom: [{ configMapRef: { name: nix-zitadel-env } }]
          env: &database-secrets
            - name: ZITADEL_DATABASE_POSTGRES_USER_PASSWORD
              valueFrom: { secretKeyRef: { name: nix-zitadel, key: db-password } }
            - name: ZITADEL_MASTERKEY
              valueFrom: { secretKeyRef: { name: nix-zitadel, key: masterkey } }
            - name: ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME
              valueFrom: { secretKeyRef: { name: nix-zitadel, key: admin-username } }
            - name: ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD
              valueFrom: { secretKeyRef: { name: nix-zitadel, key: admin-password } }
          resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { memory: 256Mi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
      containers:
        - name: zitadel
          image: ghcr.io/zitadel/zitadel:v4.16.1
          args: ["start-from-setup", "--masterkeyFromEnv", "--tlsMode", "external"]
          ports: [{ containerPort: 8080 }]
          envFrom: [{ configMapRef: { name: nix-zitadel-env } }]
          env: *database-secrets
          # First-instance setup runs before the server listens and can take minutes on a small node.
          startupProbe: { httpGet: { path: /debug/healthz, port: 8080 }, periodSeconds: 10, failureThreshold: 90 }
          livenessProbe: { httpGet: { path: /debug/healthz, port: 8080 }, periodSeconds: 10 }
          readinessProbe: { httpGet: { path: /debug/ready, port: 8080 }, periodSeconds: 5 }
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 768Mi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
