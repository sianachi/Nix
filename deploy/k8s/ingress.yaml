# Rendered with envsubst by deploy/k8s/deploy.sh - needs $DOMAIN.
#
# Three hosts. The apex is the app: all of its path routing happens inside Caddy
# (deploy/k8s/Caddyfile), which keeps the browser's view identical to development. Traefik
# proxies WebSocket upgrades without extra configuration, so the editor socket at
# /collab/documents/:id/ws works through this as written - verify with deploy/k8s/verify.sh
# rather than trusting this comment.
#
# Every other single-label subdomain goes to the anonymous sites server, which never reaches Core
# or the app's cookies. That wildcard is a second Ingress at the lowest router priority, so a name
# that must hit something else gets its own rule in the first: auth.$DOMAIN, the identity provider
# (infrastructure slugs such as auth and www are never claimable as sites).
#
# TLS terminates at Cloudflare (proxied DNS for $DOMAIN and *.$DOMAIN, SSL mode Full (strict)).
# The origin certificate in secret nix-tls is a Cloudflare Origin CA certificate covering both
# names, loaded by deploy/k8s/create-secrets.sh --tls-only. Let's Encrypt HTTP-01 cannot issue
# the wildcard, so cert-manager is deliberately not used here.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nix
  namespace: nix
  annotations:
    # Only Cloudflare's edge may reach the origin (deploy/k8s/cloudflare-only.yaml).
    traefik.ingress.kubernetes.io/router.middlewares: nix-cloudflare-only@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts: ["${DOMAIN}", "*.${DOMAIN}"]
      secretName: nix-tls
  rules:
    - host: "${DOMAIN}"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: nix-web, port: { number: 8090 } }
    # The identity provider (deploy/k8s/zitadel.yaml). "auth" is a reserved site slug, and this exact
    # host is matched before the lowest-priority sites Ingress below.
    - host: "auth.${DOMAIN}"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: nix-zitadel, port: { number: 8080 } }
---
# The sites wildcard is its own Ingress at the lowest router priority. Traefik ranks routers by rule
# length, and the regexp it builds for *.$DOMAIN is longer than Host(`auth.$DOMAIN`), so in one
# Ingress the wildcard would answer auth.$DOMAIN with the sites 404.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nix-sites
  namespace: nix
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: nix-cloudflare-only@kubernetescrd
    traefik.ingress.kubernetes.io/router.priority: "1"
spec:
  ingressClassName: traefik
  tls:
    - hosts: ["*.${DOMAIN}"]
      secretName: nix-tls
  rules:
    - host: "*.${DOMAIN}"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: nix-sites-serve, port: { number: 8400 } }
---
# Custom site hostnames (nixctl site hostnames): Cloudflare proxies them to this origin with their
# own Host, which no rule above names. A host-less rule takes any host and, at priority 1, loses to
# every host-specific router - the app, auth, the wildcard above and other namespaces' Ingresses -
# so it only catches names nothing else claims. Sites serve answers a name only for a verified
# site and 404s anything else. Cloudflare SSL mode Full (not strict) is what accepts this
# certificate for a custom name; the edge certificate is Cloudflare's own.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nix-sites-custom-hosts
  namespace: nix
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: nix-cloudflare-only@kubernetescrd
    traefik.ingress.kubernetes.io/router.priority: "1"
spec:
  ingressClassName: traefik
  tls:
    - secretName: nix-tls
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: nix-sites-serve, port: { number: 8400 } }
