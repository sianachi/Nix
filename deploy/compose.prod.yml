name: nix

services:
  nix-versitygw:
    image: versity/versitygw:v1.7.0
    restart: unless-stopped
    command: ["--health", "/health", "posix", "/data"]
    environment:
      ROOT_ACCESS_KEY: ${NIX_OBJECT_STORE_ACCESS_KEY:?set NIX_OBJECT_STORE_ACCESS_KEY}
      ROOT_SECRET_KEY: ${NIX_OBJECT_STORE_SECRET_KEY:?set NIX_OBJECT_STORE_SECRET_KEY}
    volumes:
      - nix-versity-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:7070/health"]
      interval: 5s
      timeout: 3s
      retries: 12
    mem_limit: 1g
    security_opt:
      - no-new-privileges:true

  nix-storage-init:
    image: amazon/aws-cli:2.36.31
    profiles: [maintenance]
    restart: "no"
    environment:
      AWS_ACCESS_KEY_ID: ${NIX_OBJECT_STORE_ACCESS_KEY:?set NIX_OBJECT_STORE_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${NIX_OBJECT_STORE_SECRET_KEY:?set NIX_OBJECT_STORE_SECRET_KEY}
      AWS_DEFAULT_REGION: ${NIX_OBJECT_STORE_REGION:-us-east-1}
      NIX_BUCKET: ${NIX_OBJECT_STORE_BUCKET:?set NIX_OBJECT_STORE_BUCKET}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - 'aws --endpoint-url http://nix-versitygw:7070 s3api head-bucket --bucket "$$NIX_BUCKET" >/dev/null 2>&1 || aws --endpoint-url http://nix-versitygw:7070 s3api create-bucket --bucket "$$NIX_BUCKET"'
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${NIX_PG_SUPERUSER_PASSWORD:?set NIX_PG_SUPERUSER_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - nix-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s
    mem_limit: 2g
    security_opt:
      - no-new-privileges:true
    networks:
      default:
        aliases:
          - postgres

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    restart: unless-stopped
    user: "100:101"
    # This listener is plaintext by design and is reachable only on the private Compose network.
    # Set the per-service URL overrides to amqps:// when using an external TLS broker.
    environment:
      NIX_RABBITMQ_API_PASSWORD: ${NIX_RABBITMQ_API_PASSWORD:?set NIX_RABBITMQ_API_PASSWORD}
      NIX_RABBITMQ_IMPORT_PASSWORD: ${NIX_RABBITMQ_IMPORT_PASSWORD:?set NIX_RABBITMQ_IMPORT_PASSWORD}
      NIX_RABBITMQ_EXPORT_PASSWORD: ${NIX_RABBITMQ_EXPORT_PASSWORD:?set NIX_RABBITMQ_EXPORT_PASSWORD}
      NIX_RABBITMQ_PLUGIN_PASSWORD: ${NIX_RABBITMQ_PLUGIN_PASSWORD:?set NIX_RABBITMQ_PLUGIN_PASSWORD}
      NIX_RABBITMQ_CALENDAR_PASSWORD: ${NIX_RABBITMQ_CALENDAR_PASSWORD:?set NIX_RABBITMQ_CALENDAR_PASSWORD}
      NIX_RABBITMQ_NOTIFY_PASSWORD: ${NIX_RABBITMQ_NOTIFY_PASSWORD:?set NIX_RABBITMQ_NOTIFY_PASSWORD}
    volumes:
      - nix-rabbitmq-data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./rabbitmq/start.sh:/usr/local/bin/nix-rabbitmq-start:ro
    command: ["/bin/sh", "/usr/local/bin/nix-rabbitmq-start"]
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/lib/rabbitmq/.nix-topology-ready && rabbitmq-diagnostics -q check_running"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s
    mem_limit: 768m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  nix-api-init:
    image: busybox:1.37
    restart: "no"
    command: ["sh", "-c", "chown -R 1654:1654 /var/lib/nix/data-protection"]
    volumes:
      - nix-api-data-protection:/var/lib/nix/data-protection
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    security_opt:
      - no-new-privileges:true

  nix-migrate:
    image: ${NIX_IMAGE_REGISTRY:-ghcr.io/sianachi/nix}/migrator:${NIX_IMAGE_TAG:?set NIX_IMAGE_TAG}
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NIX_MIGRATOR_CONNECTION_STRING: ${NIX_MIGRATOR_CONNECTION_STRING:?set NIX_MIGRATOR_CONNECTION_STRING}
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    mem_limit: 256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  nix-template-presets:
    image: pgvector/pgvector:pg16
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      nix-migrate:
        condition: service_completed_successfully
    environment:
      PGHOST: postgres
      PGDATABASE: nix
      PGUSER: nix_migrator
      PGPASSWORD: ${NIX_PG_MIGRATOR_PASSWORD:?set NIX_PG_MIGRATOR_PASSWORD}
    command: ["psql", "-v", "ON_ERROR_STOP=1", "-f", "/seed/seed_template_presets.sql"]
    volumes:
      - ./seed/seed_template_presets.sql:/seed/seed_template_presets.sql:ro
    read_only: true
    mem_limit: 128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  nix-api:
    image: ${NIX_IMAGE_REGISTRY:-ghcr.io/sianachi/nix}/api:${NIX_IMAGE_TAG:?set NIX_IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      nix-api-init:
        condition: service_completed_successfully
      nix-template-presets:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Logging__Console__FormatterName: json
      ConnectionStrings__Nix: ${NIX_CORE_DATABASE_URL:?set NIX_CORE_DATABASE_URL}
      Nix__InternalSecret: ${NIX_INTERNAL_SECRET:?set NIX_INTERNAL_SECRET}
      Nix__Pets__WorkerUrl: http://nix-import-worker:8301
      Nix__Collaboration__BaseUrl: http://nix-collab:8100
      Nix__RabbitMq__Uri: ${NIX_RABBITMQ_API_URL:-amqp://nix-api:${NIX_RABBITMQ_API_PASSWORD:?set NIX_RABBITMQ_API_PASSWORD}@rabbitmq:5672/%2Fnix}
      Nix__ObjectStorage__Endpoint: ${NIX_OBJECT_STORE_ENDPOINT:?set NIX_OBJECT_STORE_ENDPOINT}
      Nix__ObjectStorage__PublicOrigin: ${NIX_OBJECT_STORE_PUBLIC_ORIGIN:?set NIX_OBJECT_STORE_PUBLIC_ORIGIN}
      Nix__ObjectStorage__Region: ${NIX_OBJECT_STORE_REGION:-us-east-1}
      Nix__ObjectStorage__Bucket: ${NIX_OBJECT_STORE_BUCKET:?set NIX_OBJECT_STORE_BUCKET}
      Nix__ObjectStorage__AccessKey: ${NIX_OBJECT_STORE_ACCESS_KEY:?set NIX_OBJECT_STORE_ACCESS_KEY}
      Nix__ObjectStorage__SecretKey: ${NIX_OBJECT_STORE_SECRET_KEY:?set NIX_OBJECT_STORE_SECRET_KEY}
      Nix__PublicForms__SigningKey: ${NIX_PUBLIC_FORMS_SIGNING_KEY:?set NIX_PUBLIC_FORMS_SIGNING_KEY}
      Nix__ForwardedHeaders__KnownNetworks: 172.30.0.0/24
      Nix__ForwardedHeaders__ForwardLimit: "2"
      Nix__RateLimits__WritesPerMinute: "120"
      Nix__RateLimits__PublicFormSubmissionsPerMinute: "20"
      Nix__RateLimits__SuggestionsPerMinute: "60"
      Nix__Push__VapidPublicKey: ${NIX_PUSH_VAPID_PUBLIC_KEY:-}
      Nix__GoWorkers__ExportEnabled: "true"
      Nix__GoWorkers__ImportEnabled: "true"
      Nix__Bff__Authority: ${NIX_OIDC_ISSUER:?set NIX_OIDC_ISSUER}
      Nix__Bff__ClientId: ${NIX_OIDC_CLIENT_ID:?set NIX_OIDC_CLIENT_ID}
      Nix__Bff__PublicOrigin: ${NIX_PUBLIC_ORIGIN:?set NIX_PUBLIC_ORIGIN}
      # The IdP's self-service page for password, passkey and MFA changes. Defaults to the
      # Zitadel console's own-account page; set NIX_OIDC_ACCOUNT_URL for any other provider.
      Nix__Bff__AccountPage: ${NIX_OIDC_ACCOUNT_URL:-${NIX_OIDC_ISSUER}/ui/console/users/me?id=security}
      # Also protects stored calendar refresh tokens (ADR-0052): every Core replica must share
      # this key ring. Back it up separately from the database, never alongside it.
      Nix__Bff__DataProtectionKeysPath: /var/lib/nix/data-protection
      # Two-way calendar sync. Empty leaves a provider unavailable; see compose.prod.env.example.
      Nix__Calendar__Google__ClientId: ${NIX_CALENDAR_GOOGLE_CLIENT_ID:-}
      Nix__Calendar__Google__ClientSecret: ${NIX_CALENDAR_GOOGLE_CLIENT_SECRET:-}
      Nix__Calendar__Microsoft__ClientId: ${NIX_CALENDAR_MICROSOFT_CLIENT_ID:-}
      Nix__Calendar__Microsoft__ClientSecret: ${NIX_CALENDAR_MICROSOFT_CLIENT_SECRET:-}
      Nix__Calendar__Microsoft__Tenant: ${NIX_CALENDAR_MICROSOFT_TENANT:-common}
      Nix__AccessTokens__Issuer: ${NIX_CORE_TOKEN_ISSUER:?set NIX_CORE_TOKEN_ISSUER}
      Nix__AccessTokens__Audience: ${NIX_CORE_TOKEN_AUDIENCE:?set NIX_CORE_TOKEN_AUDIENCE}
      Nix__AccessTokens__KeyId: ${NIX_CORE_TOKEN_KEY_ID:?set NIX_CORE_TOKEN_KEY_ID}
      Nix__AccessTokens__SigningKeyPemFile: /run/secrets/core-access-token.pem
      Nix__AccessTokens__LifetimeMinutes: "10"
    volumes:
      - nix-api-data-protection:/var/lib/nix/data-protection
      - ${NIX_CORE_TOKEN_SIGNING_KEY_FILE:?set NIX_CORE_TOKEN_SIGNING_KEY_FILE}:/run/secrets/core-access-token.pem:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    mem_limit: 512m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      default:
        aliases:
          - nix-api

  nix-collab-migrate:
    image: ${NIX_IMAGE_REGISTRY:-ghcr.io/sianachi/nix}/collab:${NIX_IMAGE_TAG:?set NIX_IMAGE_TAG}
    profiles: [maintenance]
    restart: "no"
    environment:
      NIX_COLLAB_MIGRATOR_CONNECTION_STRING: ${NIX_COLLAB_MIGRATOR_CONNECTION_STRING:-}
    command: ["pnpm", "--filter", "@nix/collab", "migrate-documents"]
    mem_limit: 768m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  nix-collab:
    image: ${NIX_IMAGE_REGISTRY:-ghcr.io/sianachi/nix}/collab:${NIX_IMAGE_TAG:?set NIX_IMAGE_TAG}
    restart: unless-stopped
    stop_grace_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      nix-api:
        condition: service_started
    environment:
      NIX_COLLAB_DATABASE_URL: ${NIX_COLLAB_DATABASE_URL:?set NIX_COLLAB_DATABASE_URL}
      NIX_COLLAB_CORE_BASE_URL: http://nix-api:8080
      NIX_COLLAB_INTERNAL_SECRET: ${NIX_INTERNAL_SECRET:?set NIX_INTERNAL_SECRET}
      NIX_COLLAB_OIDC_ISSUERS: ${NIX_OIDC_ISSUER:?set NIX_OIDC_ISSUER},${NIX_CORE_TOKEN_ISSUER:?set NIX_CORE_TOKEN_ISSUER}|http://nix-api:8080/public/v1/auth/jwks
      NIX_COLLAB_OIDC_AUDIENCE: ${NIX_OIDC_CLIENT_ID:?set NIX_OIDC_CLIENT_ID},${NIX_CORE_TOKEN_AUDIENCE:?set NIX_CORE_TOKEN_AUDIENCE}
      NIX_COLLAB_REAUTH_SECONDS: "60"
      NIX_COLLAB_MAX_RESIDENT_MB: "256"
      NIX_COLLAB_MAX_DOCS: "200"
      NIX_COLLAB_PORT: "8100"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8100/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 90s
    mem_limit: 768m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      default:
        aliases:
          - nix-collab

  nix-import-worker:
    image: ${NIX_IMAGE_REGISTRY:-ghcr.io/sianachi/nix}/worker:${NIX_WORKER_IMAGE_TAG:-${NIX_IMAGE_TAG:?set NIX_IMAGE_TAG}}
    user: "65532:65532"
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
      nix-api:
        condition: service_started
      nix-collab:
        condition: service_healthy
    environment:
      TMPDIR: /var/lib/nix-worker/spool
      NIX_WORKER_ROLES: import
      NIX_COMPANION_DATA_DIR: /var/lib/nix-worker/companion
      NIX_WORKER_INTERNAL_SECRET: ${NIX_INTERNAL_SECRET:?set NIX_INTERNAL_SECRET}
      NIX_WORKER_API_URL: http://nix-api:8080
      NIX_WORKER_COLLAB_URL: http://nix-collab:8100
      NIX_WORKER_OBJECT_ORIGINS: ${NIX_OBJECT_STORE_ENDPOINT:?set NIX_OBJECT_STORE_ENDPOINT},${NIX_OBJECT_STORE_PUBLIC_ORIGIN:?set NIX_OBJECT_STORE_PUBLIC_ORIGIN}
      NIX_RABBITMQ_URL: ${NIX_RABBITMQ_IMPORT_URL:-amqp://nix-import:${NIX_RABBITMQ_IMPORT_PASSWORD:?set NIX_RABBITMQ_IMPORT_PASSWORD}@rabbitmq:5672/%2Fnix}
      NIX_WORKER_MAX_CONCURRENCY: "1"
      NIX_WORKER_MAX_INPUT_BYTES: "104857600"
      NIX_WORKER_MAX_LINE_BYTES: "4194304"
      NIX_WORKER_MAX_RECORDS: "100000"
    volumes:
      - nix-companion-data:/var/lib/nix-worker/companion
    healthcheck:
      test: ["CMD", "/nix-worker", "--healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 12
    mem_limit: 1g
    read_only: true
    tmpfs:
      - "/var/lib/nix-worker/spool:rw,noexec,nosuid,nodev,size=256m,uid=65532,gid=65532,mode=0700"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      default:
        aliases:
          - nix-import-worker

  nix-export-worker:
    image: ${NIX_IMAGE_REGISTRY:-ghcr.io/sianachi/nix}/worker:${NIX_WORKER_IMAGE_TAG:-${NIX_IMAGE_TAG:?set NIX_IMAGE_TAG}}
    user: "65532:65532"
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
      nix-api:
        condition: service_started
      nix-collab:
        condition: service_healthy
    environment:
      TMPDIR: /var/lib/nix-worker/spool
      NIX_WORKER_ROLES: export
      NIX_WORKER_INTERNAL_SECRET: ${NIX_INTERNAL_SECRET:?set NIX_INTERNAL_SECRET}
      NIX_WORKER_API_URL: http://nix-api:8080
      NIX_WORKER_COLLAB_URL: http://nix-collab:8100
      NIX_WORKER_OBJECT_ORIGINS: ${NIX_OBJECT_STORE_ENDPOINT:?set NIX_OBJECT_STORE_ENDPOINT},${NIX_OBJECT_STORE_PUBLIC_ORIGIN:?set NIX_OBJECT_STORE_PUBLIC_ORIGIN}
      NIX_RABBITMQ_URL: ${NIX_RABBITMQ_EXPORT_URL:-amqp://nix-export:${NIX_RABBITMQ_EXPORT_PASSWORD:?set NIX_RABBITMQ_EXPORT_PASSWORD}@rabbitmq:5672/%2Fnix}
      NIX_WORKER_MAX_CONCURRENCY: "4"
      NIX_WORKER_MAX_INPUT_BYTES: "104857600"
      NIX_WORKER_MAX_LINE_BYTES: "4194304"
      NIX_WORKER_MAX_RECORDS: "100000"
    healthcheck:
      test: ["CMD", "/nix-worker", "--healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 12
    mem_limit: 1g
    cpus: 2
    read_only: true
    tmpfs:
      - "/var/lib/nix-worker/spool:rw,noexec,nosuid,nodev,size=512m,uid=65532,gid=65532,mode=0700"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      default:
        aliases:
          - nix-export-worker

  nix-plugin-worker:
    image: ${NIX_IMAGE_REGISTRY:-ghcr.io/sianachi/nix}/worker:${NIX_WORKER_IMAGE_TAG:-${NIX_IMAGE_TAG:?set NIX_IMAGE_TAG}}
    user: "65532:65532"
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
      nix-api:
        condition: service_started
    environment:
      TMPDIR: /var/lib/nix-worker/spool
      NIX_WORKER_ROLES: plugin-events
      NIX_WORKER_INTERNAL_SECRET: ${NIX_INTERNAL_SECRET:?set NIX_INTERNAL_SECRET}
      NIX_WORKER_API_URL: http://nix-api:8080
      NIX_WORKER_OBJECT_ORIGINS: ${NIX_OBJECT_STORE_ENDPOINT:?set NIX_OBJECT_STORE_ENDPOINT},${NIX_OBJECT_STORE_PUBLIC_ORIGIN:?set NIX_OBJECT_STORE_PUBLIC_ORIGIN}
      NIX_RABBITMQ_URL: ${NIX_RABBITMQ_PLUGIN_URL:-amqp://nix-plugin:${NIX_RABBITMQ_PLUGIN_PASSWORD:?set NIX_RABBITMQ_PLUGIN_PASSWORD}@rabbitmq:5672/%2Fnix}
      NIX_WORKER_MAX_CONCURRENCY: "4"
      NIX_PLUGIN_MAX_MODULE_BYTES: "8388608"
      NIX_PLUGIN_MEMORY_PAGES: "1024"
      NIX_PLUGIN_TIMEOUT_MILLISECONDS: "250"
      NIX_PLUGIN_MAX_HOST_CALLS: "32"
    healthcheck:
      test: ["CMD", "/nix-worker", "--healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 12
    mem_limit: 512m
    cpus: 1
    read_only: true
    tmpfs:
      - "/var/lib/nix-worker/spool:rw,noexec,nosuid,nodev,size=64m,uid=65532,gid=65532,mode=0700"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      default:
        aliases:
          - nix-plugin-worker

  nix-calendar-worker:
    image: ${NIX_IMAGE_REGISTRY:-ghcr.io/sianachi/nix}/worker:${NIX_WORKER_IMAGE_TAG:-${NIX_IMAGE_TAG:?set NIX_IMAGE_TAG}}
    user: "65532:65532"
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
      nix-api:
        condition: service_started
    environment:
      TMPDIR: /var/lib/nix-worker/spool
      NIX_WORKER_ROLES: calendar
      NIX_WORKER_INTERNAL_SECRET: ${NIX_INTERNAL_SECRET:?set NIX_INTERNAL_SECRET}
      NIX_WORKER_API_URL: http://nix-api:8080
      NIX_RABBITMQ_URL: ${NIX_RABBITMQ_CALENDAR_URL:-amqp://nix-calendar:${NIX_RABBITMQ_CALENDAR_PASSWORD:?set NIX_RABBITMQ_CALENDAR_PASSWORD}@rabbitmq:5672/%2Fnix}
      NIX_WORKER_MAX_CONCURRENCY: "4"
      NIX_CALENDAR_GOOGLE_ORIGIN: ${NIX_CALENDAR_GOOGLE_ORIGIN:-https://www.googleapis.com}
      NIX_CALENDAR_MICROSOFT_ORIGIN: ${NIX_CALENDAR_MICROSOFT_ORIGIN:-https://graph.microsoft.com}
    healthcheck:
      test: ["CMD", "/nix-worker", "--healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 12
    mem_limit: 256m
    cpus: 1
    read_only: true
    tmpfs:
      - "/var/lib/nix-worker/spool:rw,noexec,nosuid,nodev,size=16m,uid=65532,gid=65532,mode=0700"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      default:
        aliases:
          - nix-calendar-worker

  nix-notify-worker:
    image: ${NIX_IMAGE_REGISTRY:-ghcr.io/sianachi/nix}/worker:${NIX_WORKER_IMAGE_TAG:-${NIX_IMAGE_TAG:?set NIX_IMAGE_TAG}}
    user: "65532:65532"
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
      nix-api:
        condition: service_started
    environment:
      TMPDIR: /var/lib/nix-worker/spool
      NIX_WORKER_ROLES: notify
      NIX_WORKER_INTERNAL_SECRET: ${NIX_INTERNAL_SECRET:?set NIX_INTERNAL_SECRET}
      NIX_WORKER_API_URL: http://nix-api:8080
      NIX_RABBITMQ_URL: ${NIX_RABBITMQ_NOTIFY_URL:-amqp://nix-notify:${NIX_RABBITMQ_NOTIFY_PASSWORD:?set NIX_RABBITMQ_NOTIFY_PASSWORD}@rabbitmq:5672/%2Fnix}
      NIX_PUSH_VAPID_PRIVATE_KEY: ${NIX_PUSH_VAPID_PRIVATE_KEY:?set NIX_PUSH_VAPID_PRIVATE_KEY}
      NIX_PUSH_VAPID_SUBJECT: ${NIX_PUSH_VAPID_SUBJECT:?set NIX_PUSH_VAPID_SUBJECT}
      NIX_WORKER_MAX_CONCURRENCY: "4"
    healthcheck:
      test: ["CMD", "/nix-worker", "--healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 12
    mem_limit: 256m
    cpus: 1
    read_only: true
    tmpfs:
      - "/var/lib/nix-worker/spool:rw,noexec,nosuid,nodev,size=16m,uid=65532,gid=65532,mode=0700"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      default:
        aliases:
          - nix-notify-worker

  nix-web:
    image: ${NIX_IMAGE_REGISTRY:-ghcr.io/sianachi/nix}/web:${NIX_WEB_IMAGE_TAG:?set NIX_WEB_IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      nix-api:
        condition: service_started
      nix-collab:
        condition: service_healthy
    environment:
      NIX_OBJECT_STORE_PUBLIC_ORIGIN: ${NIX_OBJECT_STORE_PUBLIC_ORIGIN:?set NIX_OBJECT_STORE_PUBLIC_ORIGIN}
      NIX_OBJECT_STORE_BUCKET: ${NIX_OBJECT_STORE_BUCKET:?set NIX_OBJECT_STORE_BUCKET}
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - nix-caddy-data:/data
      - nix-caddy-config:/config
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8090/"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
    networks:
      default:
        aliases:
          # Keeps the existing remotely-managed Cloudflare route valid.
          - nix-web.nix.svc.cluster.local

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      nix-web:
        condition: service_healthy
    mem_limit: 256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  default:
    name: nix
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  nix-companion-data:
    name: nix-companion-data
  nix-postgres-data:
    name: nix-postgres-data
  nix-rabbitmq-data:
    name: nix-rabbitmq-data
  nix-versity-data:
    name: nix-versity-data
  nix-caddy-data:
    name: nix-caddy-data
  nix-caddy-config:
    name: nix-caddy-config
  nix-api-data-protection:
    name: nix-api-data-protection
